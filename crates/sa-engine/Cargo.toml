[package]
name = "sa-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
local-rag-embeddings = ["fastembed"]
redis-cache = ["redis"]

[dependencies]
# Internal (will be removed after code merge)
sa-types = { path = "../sa-types" }
sa-models = { path = "../sa-models" }
sa-data = { path = "../sa-data" }

# Core
adk-graph = { version = "0.8.0" }
akshare = "0.1"
anyhow = "1"
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
calamine = "0.31"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fastembed = { version = "4", optional = true }
futures = "0.3"
hex = "0.4"
opentelemetry = "0.28"
quick-xml = "0.38"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"], optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-tracing = { version = "0.5", features = ["opentelemetry_0_28"] }
rmcp = { version = "0.1", features = ["server", "transport-io", "transport-sse"] }
rust_decimal = { version = "1", features = ["serde"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
axum = "0.8"
tracing-subscriber = "0.3"
