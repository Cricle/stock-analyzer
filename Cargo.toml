[workspace]

[package]
name = "sa"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["report", "guide", "pick", "score"]
local-rag-embeddings = ["fastembed"]
report = []
guide = []
pick = []
score = []

[dependencies]
# External data
akshare = { version = "0.1.10", features = ["market-client"] }

# Core
adk-graph = { version = "0.8.0" }
anyhow = "1"
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
fastembed = { version = "4", optional = true }
futures = "0.3"
hex = "0.4"
opentelemetry = "0.28"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rust_decimal = "1"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
reqwest-middleware = "0.4"
dirs = "5"

[profile.dev]
debug = 0
incremental = false
codegen-units = 1

[profile.test]
debug = 0
incremental = false
codegen-units = 1

[profile.ci]
inherits = "test"
debug = 0
incremental = false
codegen-units = 4
