[workspace]
members = ["crates/sa-types", "crates/sa-models", "crates/sa-data", "crates/sa-engine", "crates/sa-storage"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[package]
name = "stock-analyzer-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dev-dependencies]
sa-models = { path = "crates/sa-models" }
sa-engine = { path = "crates/sa-engine" }
sa-data = { path = "crates/sa-data" }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
codegen-units = 1

[profile.test]
debug = 0
incremental = false
codegen-units = 1

[profile.ci]
inherits = "test"
debug = 0
incremental = false
codegen-units = 4
