name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross
      - name: Build CLI
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} --bin sa-engine
      - name: Build MCP
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} --bin sa-engine-mcp
      - name: Compress binaries with UPX -5
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          if command -v brew &>/dev/null; then
            brew install upx
          elif command -v choco &>/dev/null; then
            choco install upx -y
          else
            sudo apt-get update && sudo apt-get install -y upx-ucl || sudo apt-get install -y upx
          fi
          cd target/${{ matrix.target }}/release
          for bin in sa-engine* sa-engine-mcp*; do
            [ -f "$bin" ] && upx -5 "$bin" || true
          done
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../config.example.toml .
          cp ../../../README.md .
          tar czf ../../../sa-engine-${{ github.ref_name }}-${{ matrix.target }}.tar.gz sa-engine sa-engine-mcp config.example.toml README.md
      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../config.example.toml .
          cp ../../../README.md .
          Compress-Archive -Path sa-engine.exe, sa-engine-mcp.exe, config.example.toml, README.md -DestinationPath ../../../sa-engine-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sa-engine-${{ matrix.target }}
          path: sa-engine-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sa-engine-*.tar.gz
            sa-engine-*.zip
