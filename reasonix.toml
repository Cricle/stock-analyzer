allow = ["Bash(cd /root/github/stock-analyzer && grep -r \"fn main\" --include=\"*.rs\" -l 2>/dev/null | head -20)", "Bash(cd /root/github/stock-analyzer && cargo check 2>&1 | tail -30)", "Bash(find /root/github/akshare-rs -name \"*.rs\" -exec grep -l \"struct FundamentalsSnapshot\" {} \\;)", "Bash(cd /root/github/stock-analyzer && cargo test --lib scoring 2>&1 | tail -30)", "Bash(cd /root/github/stock-analyzer && cargo test scoring 2>&1 | tail -30)", "Bash(cd /root/github/stock-analyzer && cargo test e2e_scoring 2>&1 | tail -20)", "Bash(cd /root/github/stock-analyzer && cargo test e2e_score 2>&1 | tail -20)", "Bash(cd /root/github/stock-analyzer && cargo test --test e2e_scoring 2>&1 | tail -20)", "Bash(echo \"TUSHARE_TOKEN=${TUSHARE_TOKEN:-(not set)}\" && echo \"LLM_API_KEY=${LLM_API_KEY:-(not set)}\" && echo \"FINNHUB_API_KEY=${FINNHUB_API_KEY:-(not set)}\" && echo \"DATA_DIR=${DATA_DIR:-/data}\")", "Bash(cd /root/github/stock-analyzer && cat > /tmp/diag_a_share.rs << 'ENDOFFILE'\n// Diagnostic: Simulate A-share scoring with partial data\nuse sa::score::dimensions::{\n    fundamental::{self, FundamentalInput},\n    technical::{self, TechnicalInput},\n    llm_analysis::{self, LlmAnalysisInput},\n};\nuse sa::score::config::ScoreConfig;\nuse sa::score::score_types::{ScoreWeights, DimensionScore};\n\nfn main() {\n    // ── Scenario 1: \"Healthy\" US stock (like AAPL) ──\n    let us_tech = TechnicalInput {\n        rsi: Some(55.0), macd: Some(0.3), macd_signal: Some(0.2), macd_hist: Some(0.1),\n        adx: Some(25.0), close_10_ema: Some(183.0), close_50_sma: Some(180.0),\n        close_200_sma: Some(170.0), obv: None, current_price: Some(185.5),\n        volume_elevated: true, latest_positive: true,\n    };\n    let us_fund = FundamentalInput {\n        pe_like: Some(28.0), ps_like: Some(7.0), roe: Some(150.0), leverage: Some(1.5),\n        market_cap: Some(2_800_000_000_000.0), revenues_usd: Some(394_000_000_000.0),\n        net_income_usd: Some(100_000_000_000.0),\n    };\n    let us_llm = LlmAnalysisInput {\n        confidence: 72.0, objective_final_score: 68.0, momentum_score: 65.0,\n        hit_rate: Some(0.65), catalyst_count: 3, hard_negative_count: 0,\n        volume_ratio: Some(1.3), period_return_pct: Some(5.0),\n    };\n    \n    let us_tech_score = technical::score_technical(&us_tech);\n    let us_fund_score = fundamental::score_fundamental(&us_fund);\n    let us_llm_score = llm_analysis::score_llm_analysis(&us_llm);\n    // sentiment mock\n    let us_sent = DimensionScore { score: 65, reason: \"mock bullish news\".into() };\n    let us_total = weighted_total_default(&us_tech_score, &us_fund_score, &us_sent, &us_llm_score);\n    \n    println!(\"=== 美股(完整数据) ===\");\n    println!(\"  技术面: {} ({})\", us_tech_score.score, us_tech_score.reason);\n    println!(\"  基本面: {} ({})\", us_fund_score.score, us_fund_score.reason);\n    println!(\"  情绪面: {} ({})\", us_sent.score, us_sent.reason);\n    println!(\"  LLM分析: {} ({})\", us_llm_score.score, us_llm_score.reason);\n    println!(\"  → 总分: {} → {}\", us_total, sa::score::types::score_label(us_total));\n\n    println!();\n\n    // ── Scenario 2: A-share with Tushare missing (no fundamentals) ──\n    let a_tech = TechnicalInput {\n        rsi: Some(42.0), macd: Some(0.1), macd_signal: Some(0.05), macd_hist: Some(0.05),\n        adx: Some(18.0), close_10_ema: Some(22.0), close_50_sma: Some(24.0),\n        close_200_sma: Some(28.0), obv: None, current_price: Some(21.5),\n        volume_elevated: false, latest_positive: false,\n    };\n    let a_fund_no_tushare = FundamentalInput {\n        pe_like: None, ps_like: None, roe: None, leverage: None,\n        market_cap: Some(50_000_000_000.0), revenues_usd: None, net_income_usd: None,\n    };\n    let a_llm = LlmAnalysisInput {\n        confidence: 55.0, objective_final_score: 52.0, momentum_score: 42.0,\n        hit_rate: None, catalyst_count: 1, hard_negative_count: 0,\n        volume_ratio: Some(0.7), period_return_pct: Some(-3.0),\n    };\n    \n    let a_tech_score = technical::score_technical(&a_tech);\n    let a_fund_score = fundamental::score_fundamental(&a_fund_no_tushare);\n    let a_llm_score = llm_analysis::score_llm_analysis(&a_llm);\n    let a_sent = DimensionScore { score: 45, reason: \"mock mixed A-share news\".into() };\n    let a_total = weighted_total_default(&a_tech_score, &a_fund_score, &a_sent, &a_llm_score);\n    \n    println!(\"=== A股(Tushare缺失+偏弱技术面) ===\");\n    println!(\"  技术面: {} ({})\", a_tech_score.score, a_tech_score.reason);\n    println!(\"  基本面: {} ({})\", a_fund_score.score, a_fund_score.reason);\n    println!(\"  情绪面: {} ({})\", a_sent.score, a_sent.reason);\n    println!(\"  LLM分析: {} ({})\", a_llm_score.score, a_llm_score.reason);\n    println!(\"  → 总分: {} → {}\", a_total, sa::score::types::score_label(a_total));\n\n    println!();\n\n    // ── Scenario 3: A-share with Tushare + EastMoney partial data ──\n    let a_fund_partial = FundamentalInput {\n        pe_like: Some(35.0),   // got market_cap and net_income from EastMoney\n        ps_like: Some(5.0),     // got revenues\n        roe: None,              // no stockholders_equity\n        leverage: None,         // no total_debt\n        market_cap: Some(50_000_000_000.0), \n        revenues_usd: Some(10_000_000_000.0),\n        net_income_usd: Some(1_400_000_000.0),\n    };\n    let a_fund_partial_score = fundamental::score_fundamental(&a_fund_partial);\n    let a_total2 = weighted_total_default(&a_tech_score, &a_fund_partial_score, &a_sent, &a_llm_score);\n\n    println!(\"=== A股(Tushare缺失+EastMoney有部分数据) ===\");\n    println!(\"  基本面: {} ({})\", a_fund_partial_score.score, a_fund_partial_score.reason);\n    println!(\"  → 总分: {} → {}\", a_total2, sa::score::types::score_label(a_total2));\n\n    println!();\n    println!(\"=== 对比 ===\");\n    println!(\"  美股总分: {} ({}), A股(无数据): {} ({}), A股(部分): {} ({})\",\n        us_total, sa::score::types::score_label(us_total),\n        a_total, sa::score::types::score_label(a_total),\n        a_total2, sa::score::types::score_label(a_total2));\n}\n\nfn weighted_total_default(\n    tech: &DimensionScore, fund: &DimensionScore, sent: &DimensionScore, llm: &DimensionScore,\n) -> u8 {\n    let w = ScoreWeights::default();\n    let total = tech.score as f64 * w.technical as f64\n        + fund.score as f64 * w.fundamental as f64\n        + sent.score as f64 * w.sentiment as f64\n        + llm.score as f64 * w.llm_analysis as f64;\n    (total / 100.0).clamp(0.0, 100.0) as u8\n}\nENDOFFILE\n\n# Add as a test\ncp /tmp/diag_a_share.rs tests/diag_a_share.rs 2>/dev/null || true\necho \"--- Now running as inline test ---\"\ncargo test --test e2e_scoring e2e_score_consistency_bullish --quiet 2>&1 | tail -5)"]
