[workspace]

[package]
name = "stock-analyzer"
version = "0.1.15"
edition = "2024"
license = "MIT"
description = "Stock analysis engine — CLI & MCP server for market guidance, stock selection, and analysis reports"
repository = "https://github.com/Cricle/stock-analyzer"

[[bin]]
name = "stock-analyzer"
path = "src/main.rs"

[features]
default = ["report", "guide", "pick", "score"]
local-rag-embeddings = ["fastembed"]
report = []
guide = []
pick = []
score = []
mcp = ["rmcp"]

[dependencies]
# External data
akshare = { version = "0.1.14", features = ["market-client"] }

# Core
adk-graph = { version = "0.8.0" }
anyhow = "1"
async-trait = "0.1"
lru = "0.12"
backoff = { version = "0.4", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
fastembed = { version = "4", optional = true }
futures = "0.3"
hex = "0.4"
opentelemetry = "0.28"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
rmcp = { version = "1.8", features = ["server", "transport-io", "transport-streamable-http-server", "schemars", "macros"], optional = true }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dirs = "5"

[profile.dev]
debug = 0
incremental = false
codegen-units = 1

[profile.test]
debug = 0
incremental = false
codegen-units = 1

[profile.ci]
inherits = "test"
debug = 0
incremental = false
codegen-units = 4
