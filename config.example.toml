# sa configuration
# Copy to ~/.config/sa-engine/config.toml or set SA_ENGINE_CONFIG env var.

[api_keys]
# Finnhub API keys for US stock news (free tier: 60 req/min).
# Supports multiple keys for round-robin rotation.
# Override with FINNHUB_API_KEY env var (comma-separated).
finnhub = []

# MCP HTTP transport authentication key.
# When set, HTTP clients must send header: X-MCP-KEY: <value>
# Leave empty or omit to disable authentication.
# Override with SA_MCP_KEY env var.
# mcp_key = ""

[scoring]
# Scoring weight configuration (must sum to 100).
# Override with SCORE_WEIGHT_TECHNICAL / SCORE_WEIGHT_FUNDAMENTAL /
# SCORE_WEIGHT_SENTIMENT / SCORE_WEIGHT_LLM_ANALYSIS env vars.

[scoring.weights]
technical = 30
fundamental = 25
sentiment = 20
llm_analysis = 25

# Max news headlines sent to LLM for sentiment scoring.
# Override with SCORE_SENTIMENT_NEWS_LIMIT env var.
# sentiment_news_limit = 10
